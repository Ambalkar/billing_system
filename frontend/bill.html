<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generate Bill - Billing Software</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/validation.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Generate Bill</h2>
        <form id="billForm" action="/createBill" method="post" onsubmit="return validateBillForm()">
            <label for="billDate">Bill Date:</label>
            <input type="date" id="billDate" name="billDate" required />
            <label for="dueDate">Due Date:</label>
            <input type="date" id="dueDate" name="dueDate" required />
            <label for="totalAmount">Total Amount:</label>
            <input type="number" id="totalAmount" name="totalAmount" step="0.01" min="0" required />
            <button type="submit">Create Bill</button>
        </form>
        <div id="errorMsg" class="error"></div>
    </div>
</body>
</html>
